name: Compilar WordCraft con Español

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar ejecutable de Windows
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cambiar a la rama de Español (PR #1522 de SammyL)
        shell: bash
        run: |
          git fetch https://github.com/storytold/wordcraft.git pull/1522/head:spanish-branch
          git checkout spanish-branch

      - name: Corregir copiado y pegado de tablas
        shell: pwsh
        run: |
          $file = "crates/doc/src/edit.rs"
          $target = @"
            return out;
        }
        for p in self.paths_between(&a, &b) {
"@
          $patch = @"
            return out;
        }
        if let (Some((ta, ra, _)), Some((tb, rb, _))) = (a.path.cell(), b.path.cell()) {
            if ta == tb {
                if let Some(t) = self.table(a.story, &ta) {
                    let r0 = ra.min(rb);
                    let r1 = ra.max(rb);
                    let mut sub = t.clone();
                    if r0 == 0 && r1 + 1 >= t.rows.len() {
                        out.push(Block::Table(sub));
                        return out;
                    } else if r1 < t.rows.len() {
                        sub.rows = t.rows[r0..=r1].to_vec();
                        out.push(Block::Table(sub));
                        return out;
                    }
                }
            }
        }
        for p in self.paths_between(&a, &b) {
"@
          $content = [System.IO.File]::ReadAllText($file)
          if ($content.Contains("`r`n")) {
              $target = $target.Replace("`r`n", "`n").Replace("`n", "`r`n")
              $patch = $patch.Replace("`r`n", "`n").Replace("`n", "`r`n")
          } else {
              $target = $target.Replace("`r`n", "`n")
              $patch = $patch.Replace("`r`n", "`n")
          }
          if (-not $content.Contains($target)) {
              throw "Target string not found in $file"
          }
          $newContent = $content.Replace($target, $patch)
          [System.IO.File]::WriteAllText($file, $newContent)
          Write-Output "Parche de tablas aplicado con exito."

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar WordCraft en modo Release
        run: |
          cargo build --release --bin wordcraft --bin wordcraft-cli

      - name: Guardar ejecutable como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Espanol-Windows
          path: |
            target/release/wordcraft.exe
            target/release/wordcraft-cli.exe
